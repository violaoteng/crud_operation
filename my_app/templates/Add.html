{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add user | PeopleDesk</title>
    <link rel="stylesheet" href="{% static 'my_app/css/dashboard.css' %}">
</head>
<body>
<main class="shell">
    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">U</span>
            <span>People<span style="color: var(--accent)">Desk</span></span>
        </a>
        <span class="top-note">User management workspace</span>
    </header>

    <section class="panel content-card form-card">
        <p class="eyebrow">User directory</p>
        <h2>Add a user</h2>
        <p class="content-intro">Create a profile by filling in the user's details below.</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <button class="button" type="submit">Save user</button>
                <a class="secondary-button" href="/">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
